<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>結果</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div class="container">

		<div class="question-card">

			<h2>結果</h2>

			<p class="score">
				<span th:text="${score}"></span>/
				<span th:text="${total}"></span>問正解
			</p>

			<div class="result-actions">

				<button class="button"
						th:attr="data-url=@{'/quiz/' + ${category} + '/' + ${setIndex} + '/0'}"
						onclick="location.href=this.dataset.url">
					もう一度挑戦
				</button>

				<button class="button"
						th:attr="data-url=@{'/quiz/' + ${category} + '/list'}"
						onclick="location.href=this.dataset.url">
					問題選択へ戻る
				</button>

				<button class="button"
						onclick="location.href='/quiz'">
					カテゴリ選択へ戻る
				</button>

			</div>

		</div>

	</div>

</body>
</html>
