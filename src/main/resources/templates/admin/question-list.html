<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>問題一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div class="container question-list-container">

		<h1>問題一覧</h1>

		<div class="list-header">
			<a th:href="@{/quiz/admin/question/add}" class="button">
				問題を追加
			</a>

			<a th:href="@{/quiz/admin}" class="button">
				管理画面へ戻る
			</a>
		</div>

		<!-- 検索・絞り込み -->
		<div class="question-filter">

			<div class="filter-item">
				<label for="categoryId">カテゴリ</label>
				<select id="categoryId" name="categoryId" form="question-search-form">
					<option value="">すべて</option>

					<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
						th:selected="${category.id == selectedCategoryId}">
					</option>
				</select>
			</div>

			<div class="filter-item">
				<label for="quizSetId">章</label>
				<select id="quizSetId" name="quizSetId" form="question-search-form">
					<option value="">すべて</option>

					<option th:each="quizSet : ${quizSets}" th:value="${quizSet.id}" th:text="${quizSet.title}"
						th:selected="${quizSet.id == selectedQuizSetId}">
					</option>
				</select>
			</div>

			<div class="filter-item keyword-item">
				<label for="keyword">問題検索</label>
				<input type="text" id="keyword" name="keyword" th:value="${keyword}" placeholder="問題文を入力"
					form="question-search-form">
			</div>

			<div class="filter-action">
				<form id="question-search-form" th:action="@{/quiz/admin/question}" method="get">

					<button type="submit" class="button">
						検索
					</button>

				</form>
			</div>

		</div>

		<!-- 件数 -->
		<div class="question-count">
			<span th:text="${questions.size()}"></span> 件
		</div>

		<!-- 問題一覧 -->
		<table class="question-table">

			<thead>
				<tr>
					<th class="quiz-set-column">クイズセット</th>
					<th class="question-column">問題文</th>
					<th class="action-column">操作</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="question : ${questions}">

					<td class="quiz-set-column" th:text="${question.quizSet.title}">
					</td>

					<td class="question-column" th:text="${question.questionText}">
					</td>

					<td class="action-column">

						<a th:href="@{/quiz/admin/question/edit(id=${question.id})}" class="small-button">
							編集
						</a>

						<form th:action="@{/quiz/admin/question/delete}" method="post" class="delete-form"
							onsubmit="return confirm('この問題を削除しますか？');">

							<input type="hidden" name="id" th:value="${question.id}">

							<button type="submit" class="small-button delete-button">
								削除
							</button>

						</form>

					</td>

				</tr>

				<tr th:if="${questions.isEmpty()}">
					<td colspan="3" class="no-result">
						該当する問題がありません。
					</td>
				</tr>

			</tbody>

		</table>

		<div class="list-footer">
			<a th:href="@{/quiz/admin}" class="small-button">
				管理画面へ戻る
			</a>
		</div>

	</div>

</body>

</html>
