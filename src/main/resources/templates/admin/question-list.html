<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>問題一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div class="container">

		<h1>問題一覧</h1>

		<a th:href="@{/quiz/admin/question/add}" class="button">
			問題を追加
		</a>

		<a th:href="@{/quiz/admin}" class="button">
			管理画面へ戻る
		</a>


		<form th:action="@{/quiz/admin/question}" method="get">

			<label for="categoryId">カテゴリ：</label>
			<select id="categoryId" name="categoryId">
				<option value="">すべて</option>

				<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
					th:selected="${category.id == selectedCategoryId}">
				</option>
			</select>

			<label for="quizSetId">章：</label>
			<select id="quizSetId" name="quizSetId">
				<option value="">すべて</option>

				<option th:each="quizSet : ${quizSets}" th:value="${quizSet.id}" th:text="${quizSet.title}"
					th:selected="${quizSet.id == selectedQuizSetId}">
				</option>
			</select>

			<button type="submit" class="small-button">
				絞り込み
			</button>

		</form>
		<table>
			<thead>
				<tr>
					<th>ID</th>
					<th>クイズセット</th>
					<th>問題文</th>
					<th>操作</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="question : ${questions}">

					<td th:text="${question.id}"></td>

					<td th:text="${question.quizSet.title}"></td>

					<td th:text="${question.questionText}"></td>

					<td>
						<a th:href="@{/quiz/admin/question/edit(id=${question.id})}" class="small-button">
							編集
						</a>

						<form th:action="@{/quiz/admin/question/delete}" method="post" style="display:inline;"
							onsubmit="return confirm('この問題を削除しますか？');">

							<input type="hidden" name="id" th:value="${question.id}">

							<button type="submit" class="small-button delete-button">
								削除
							</button>

						</form>
					</td>

				</tr>
			</tbody>
		</table>

		<br>

		<a th:href="@{/quiz/admin}" class="small-button">
			管理画面へ戻る
		</a>

	</div>

</body>

</html>
