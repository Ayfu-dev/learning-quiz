<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>管理者ログイン</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div class="container">

		<div class="question-card">

			<h1>管理者ログイン</h1>

			<form th:action="@{/quiz/admin/login}" method="post">

				<div class="admin-login-form">

					<label for="password">
						パスワード
					</label>

					<input type="password" id="password" name="password" required>

					<p th:if="${error}" class="login-error" th:text="${error}">
					</p>

					<div class="button-area">

						<button type="submit" class="button">
							ログイン
						</button>

						<a th:href="@{/quiz}" class="small-button">
							戻る
						</a>

					</div>

				</div>

			</form>

		</div>

	</div>

</body>

</html>
