<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>クイズセット一覧</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container quiz-set-list-container">
		<h1>クイズセット一覧</h1>
		<!-- 上部ボタン -->
		<div class="list-header">

			<a th:href="@{/quiz/admin/quiz_set/add}" class="button">
				クイズセットを追加
			</a>

			<a th:href="@{/quiz/admin}" class="button">
				管理画面へ戻る
			</a>
		</div>

		<!-- カテゴリ絞り込み -->
		<div class="quiz-set-filter">
			<div class="filter-item">
				<label for="categoryId">
					カテゴリ
				</label>

				<select id="categoryId" name="categoryId" form="quiz-set-search-form">
					<option value="">
						すべて
					</option>

					<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
						th:selected="${category.id == selectedCategoryId}">
					</option>
				</select>
			</div>

			<div class="filter-action">
				<form id="quiz-set-search-form" th:action="@{/quiz/admin/quiz_set}" method="get">
					<button type="submit" class="button">
						絞り込み
					</button>
				</form>
			</div>
		</div>

		<!-- 件数 -->
		<div class="question-count">
			<span th:text="${quizSets.size()}"></span> 件
		</div>

		<!-- 並び順保存用フォーム -->
		<form id="quiz-set-order-form" th:action="@{/quiz/admin/quiz_set/order}" method="post">
			<input type="hidden" name="categoryId" th:value="${selectedCategoryId}">
		</form>

		<!-- クイズセット一覧 -->
		<table class="quiz-set-table">
			<thead>
				<tr>
					<th class="order-column">
						順番
					</th>

					<th class="category-column">
						カテゴリ
					</th>

					<th class="title-column">
						タイトル
					</th>

					<th class="action-column">
						操作
					</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="quizSet : ${quizSets}">
					<!-- 順番 -->
					<td class="order-column">
						<input type="hidden" name="quizSetIds" th:value="${quizSet.id}" form="quiz-set-order-form">

						<input type="number" name="quizSetOrders" min="1" class="order-input"
							th:value="${quizSet.quizSetOrder}" form="quiz-set-order-form">
					</td>

					<!-- カテゴリ -->
					<td class="category-column" th:text="${quizSet.category.name}">
					</td>

					<!-- タイトル -->
					<td class="title-column" th:text="${quizSet.title}">
					</td>

					<!-- 操作 -->
					<td class="action-column">

						<a th:href="@{/quiz/admin/quiz_set/edit(id=${quizSet.id})}" class="small-button">
							編集
						</a>

						<form th:action="@{/quiz/admin/quiz_set/delete}" method="post" class="delete-form"
							onsubmit="return confirm('このクイズセットを削除しますか？');">

							<input type="hidden" name="id" th:value="${quizSet.id}">

							<button type="submit" class="small-button delete-button">
								削除
							</button>
						</form>
					</td>
				</tr>

				<tr th:if="${quizSets.isEmpty()}">
					<td colspan="4" class="no-result">
						クイズセットがありません。
					</td>
				</tr>
			</tbody>
		</table>

		<!-- 並び順保存 -->
		<div th:if="${selectedCategoryId != null}" class="order-save-area">

			<button type="submit" form="quiz-set-order-form" class="button">

				並び順を保存

			</button>
		</div>

		<!-- 下部ボタン -->
		<div class="list-footer">
			<a th:href="@{/quiz/admin}" class="small-button">
			管理画面へ戻る
			</a>
		</div>
	</div>

</body>

</html>
